name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only the newest run per ref needs to finish; supersede in-progress ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    # Healthy runs finish in ~1-2 minutes. Cap well above that so a hang
    # does not burn the full 6-hour default.
    timeout-minutes: 10
    env:
      # The repo's git hooks are irrelevant on CI, and `prepare` would run husky
      # on every install.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7

      # Node version comes from .nvmrc (currently 24), which matches the root
      # `engines.node` requirement of >=24.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The repo pins yarn via `packageManager`, so Corepack has to be on before
      # any yarn invocation -- including the cache lookup below.
      - name: Enable Corepack
        run: corepack enable

      - name: Locate yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      # --immutable fails the build if yarn.lock is out of date rather than
      # silently resolving something new.
      - name: Install dependencies
        run: yarn install --immutable

      # The checks below are independent, so each one runs even after an earlier
      # failure. That way a single CI run reports every problem instead of only
      # the first. `!cancelled()` still respects concurrency cancellation.
      - name: Lint
        if: ${{ !cancelled() }}
        run: yarn lint

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: yarn format:check

      - name: Test
        if: ${{ !cancelled() }}
        run: yarn test

      - name: Build
        if: ${{ !cancelled() }}
        run: yarn build

      - name: Build Storybook
        if: ${{ !cancelled() }}
        run: yarn storybook:build
